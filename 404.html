<!doctype html>
<html>
  <head>
    <!-- GitHub Pages serves this for any unmatched path - stash the real
         URL and bounce to index.html, which restores it (see index.html's
         own comment). Standard spa-github-pages technique. -->
    <script>
      sessionStorage.redirect = location.href;
    </script>
    <meta http-equiv="refresh" content="0;URL='/'">
  </head>
  <body></body>
</html>
