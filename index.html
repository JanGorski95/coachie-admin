    <title>Ramvo - Admin</title>
    <!--
      GitHub Pages has no server-side rewrites, so a deep link
      (admin.ramvo.app/clients) 404s on a real page load - GitHub serves
      404.html for that, which redirects here with the real path encoded in
      a query param (?/clients). This restores it via history.replaceState
      before React Router ever reads location, so a refresh/bookmark on a
      real route works. Standard spa-github-pages technique
      (github.com/rafgraph/spa-github-pages) - pairs with dist/404.html.
    -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
